{% extends "base.html" %}

{% block title %}Anotações Internas{% endblock %}

{% block content %}
<style>
    /* Força largura total */
    .max-w-6xl { max-width: 100% !important; margin: 0 !important; padding: 0 20px !important; }
    
    .spreadsheet-wrapper {
        width: 100%;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }
</style>

<div class="mb-4 px-4 flex justify-between items-center">
    <div>
        <h1 class="text-2xl font-black text-sa-wine tracking-tight">Anotações</h1>
        <p class="text-xs text-sa-muted font-medium mt-0.5">Planilha corporativa integrada de controle e anotações gerais.</p>
    </div>
</div>

<div class="spreadsheet-wrapper" style="height: calc(100vh - 160px); position: relative;">
    <!-- Spinner de Carregamento Premium -->
    <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 transition-opacity duration-500 z-10">
        <div class="w-10 h-10 border-4 border-sa-wine border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-sa-muted font-bold mt-4 tracking-wider">CARREGANDO PLANILHA CORPORATIVA...</p>
    </div>
    
    <!-- Iframe Incorporando Google Sheets (Dinâmico por Função/Role) -->
    {% if current_user.role == 'admin' %}
        <!-- Admins: Modo Edição Minimalista (As abas aparecem na parte inferior nativamente) -->
        <iframe src="https://docs.google.com/spreadsheets/d/1Fr28wpAWgYJNcVqKIucGmx9QCd9-28Zy2Elu-nPrSc8/edit?rm=minimal" 
                style="width: 100%; height: 100%; border: none;" 
                onload="document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').style.display = 'none', 500);"
                allowfullscreen></iframe>
    {% else %}
        <!-- Usuários Comuns: Modo Visualização Protegida com Abas Fixas e Navegáveis no rodapé (preview?widget=true) -->
        <iframe src="https://docs.google.com/spreadsheets/d/1Fr28wpAWgYJNcVqKIucGmx9QCd9-28Zy2Elu-nPrSc8/preview?widget=true" 
                style="width: 100%; height: 100%; border: none;" 
                onload="document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').style.display = 'none', 500);"
                allowfullscreen></iframe>
    {% endif %}
</div>

<script>
console.log('Planilha Google Sheets carregada com seletor de abas fixado no rodapé.');
</script>
{% endblock %}
