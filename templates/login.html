<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Construtora Sousa Araujo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; }
        .bg-wine { background-color: #7a0f0f; }
        .text-wine { color: #7a0f0f; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full glass rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-wine rounded-2xl mb-4 shadow-lg">
                <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Bem-vindo</h1>
            <p class="text-slate-400 mt-2">Acesse o sistema de comissões</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-4 rounded-xl text-sm {% if category == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-amber-500/10 text-amber-400 border border-amber-500/20{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="block w-full pl-11 pr-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-wine/50 focus:border-wine transition-all"
                        placeholder="Seu usuário">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="block w-full pl-11 pr-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-wine/50 focus:border-wine transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 bg-wine hover:bg-wine/90 text-white font-bold rounded-xl shadow-lg shadow-wine/20 transform transition-all hover:-translate-y-0.5 active:translate-y-0">
                Entrar no Painel
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-slate-800 text-center text-slate-500 text-xs">
            &copy; 2026 Construtora Sousa Araujo. Acesso Restrito.
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
